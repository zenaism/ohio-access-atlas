# Controlled vocabulary for destination accessibility facts. Every extracted fact uses one of these
# names, so "restroom_accessible" never also appears as "accessible_bathroom".
# value: yes | limited | no | unknown, plus `detail` (free text) and a verbatim `evidence_quote`.
entrance_step_free: "Step-free (level or ramped) way in; detail says which entrance"
automatic_door: "Powered or push-button door"
elevator: "Elevator or lift between public floors"
accessible_route_inside: "Exhibits/areas reachable without steps; detail lists exceptions"
ramp_steep: "A ramp steeper than ADA (1:12) is on the route"
restroom_accessible: "Wheelchair-accessible restroom"
restroom_family: "Family / all-gender / companion restroom"
adult_changing_table: "Adult-size changing table"
wheelchair_loan: "Wheelchairs lent on site (detail: cost, deposit, how)"
scooter_or_ecv: "Scooters / ECVs available or allowed"
accessible_parking: "Accessible parking spaces (detail: where, how many, cost)"
drop_off: "Passenger drop-off near the entrance"
accessible_seating: "Wheelchair seating in theaters/venues"
companion_admission: "Free or discounted companion/caregiver ticket"
seating_rest: "Benches / places to sit along the route"
sensory_friendly: "Sensory-friendly hours, kits, maps"
quiet_room: "Quiet / calming space"
asl_interpretation: "ASL interpretation available or on request"
captioning: "Captions on films/media"
assistive_listening: "Assistive listening devices"
service_animals: "Service animal policy"
accessibility_map: "Accessibility / sensory map or guide document exists (detail: URL)"
accessibility_contact: "Contact for access questions or accommodation requests"
transit_access: "Accessible transit nearby (bus, streetcar)"
trail_surface: "Trail surface (paved, crushed stone, boardwalk, natural)"
trail_width: "Trail tread width"
trail_grade: "Running / maximum slope of a trail"
all_terrain_chair: "All-terrain or track chair loan"
adaptive_recreation: "Adaptive recreation equipment or facilities (accessible kayak launch, single-rider golf cart, accessible playground or swing)"
accessible_lodging: "Accessible guest rooms or cabins (detail: roll-in shower, door width, count)"
mobility_device_policy: "Rules on wheelchairs and other power-driven mobility devices on trails"
