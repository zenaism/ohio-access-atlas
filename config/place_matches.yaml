# Where each place named in data/extracted/venue_facts.jsonl sits on the map.
# Matched by EXACT name (case-insensitive) in the gazetteer (OSM destinations > OSM POIs > Overture),
# optionally filtered by category text. Fuzzy matching was tried and rejected: it scores
# "Cincinnati Art Museum" 100 against an artwork named "Cincinnati".
#   name:     gazetteer name to look up        category: substring the category must contain
#   layer:    culture | park | lodging | adaptive_recreation
#   skip:     reason the place is not a single point (it stays in the data, just not on the map)

