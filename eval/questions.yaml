- id: up-to-date
  category: trust
  question: Is this info up to date? (about Cincinnati Museum Center)
  call: {tool: get_place, args: {name_or_id: Cincinnati Museum Center}}
  expect_any: [Cincinnati Museum Center]
  note: answer must give the newest source date and the per-fact dates
- id: facebook-ramp
  category: trust
