- id: ada-compliant
  category: trust
  question: Is Music Hall ADA compliant?
  call: {tool: get_place, args: {name_or_id: Music Hall}}
  expect_any: [Music Hall]
  note: must not certify compliance; report what the venue says and that compliance is a legal finding
