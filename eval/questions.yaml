# Question bank (from the plan doc), in the words a wheelchair user, blind user or companion might use.
#
# call:         the tool call a good assistant would make first (scripts/eval_tools.py runs it)
# expect_any:   at least one of these names must appear in the top 5 results (a "hit")
# expect_unknown: the data does not hold the answer yet; the assistant must say "not known"
#                 and `gap` says what data is missing
# Locations used for "near me": Fountain Square 39.1016,-84.5126; Uptown Oxford 39.5103,-84.7425.

- id: restroom-near-me
  category: restrooms
  question: Where's the closest wheelchair accessible bathroom to me right now? (at Fountain Square)
  call: {tool: nearest, args: {lat: 39.1016, lon: -84.5126, need: accessible_restroom, max_miles: 1}}
  expect_any: [Aronoff Center for the Arts, Contemporary Arts Center, Taft Museum of Art, Restroom near Lytle Park]
- id: changing-table-downtown
  category: restrooms
  question: Is there a bathroom with an adult changing table anywhere downtown?
  call: {tool: nearest, args: {lat: 39.1016, lon: -84.5126, need: adult_changing_table, max_miles: 2}}
  expect_any: [Cincinnati Museum Center]
- id: findlay-restroom
  category: restrooms
  question: Does Findlay Market have an accessible restroom?
  call: {tool: search_places, args: {query: Findlay Market, region: cincinnati}}
  expect_unknown: true
  gap: Findlay Market's own accessibility page is not collected; OSM restroom near it has no wheelchair tag
- id: smale-restroom
  category: restrooms
  question: I'm at Smale Park. Where can I use the bathroom?
  call: {tool: get_place, args: {name_or_id: Smale Riverfront Park}}
  expect_any: [Smale Riverfront Park]
  note: the park record has restroom-related facts only indirectly; nearby restrooms come from nearest()
- id: oxford-restroom-late
  category: restrooms
  question: Are there accessible restrooms in Uptown Oxford open after 9 pm?
  call: {tool: nearest, args: {lat: 39.5103, lon: -84.7425, need: accessible_restroom, max_miles: 1}}
  expect_unknown: true
  gap: no Uptown public restroom with wheelchair and opening-hours data; restaurant listings do not say

- id: otr-coffee
  category: food
  question: Find me a coffee shop in OTR with no steps at the door.
  call: {tool: nearest, args: {lat: 39.1140, lon: -84.5150, need: listed_wheelchair_accessible, place_type: food_drink, max_miles: 0.7}}
  expect_any: [Ché, Taglio, MECCA, Alice, Fifty Fifty Gin Club]
  note: OSM wheelchair=yes is the only signal; it is not specific to coffee or to the door
- id: oxford-restaurant-bathroom
  category: food
  question: Which restaurants in Oxford have an accessible bathroom too?
  call: {tool: search_places, args: {region: oxford, place_type: food_drink, need: accessible_restroom}}
  expect_unknown: true
  gap: Enjoy Oxford tags say "wheelchair accessible" with no restroom detail
- id: northside-brewery
  category: food
  question: Is there a brewery with a ramp and outdoor seating near Northside?
  call: {tool: search_places, args: {query: brewery, region: cincinnati}}
  expect_unknown: true
  gap: no ramp or patio data for breweries
- id: skyline-ludlow
  category: food
  question: Can I get my power chair into Skyline on Ludlow?
  call: {tool: search_places, args: {query: Skyline Ludlow, region: cincinnati}}
  expect_unknown: true
  gap: that Skyline is not in the data (the only Skyline is in Oxford); needs addresses or Google Places
- id: otr-birthday
  category: food
  question: Somewhere for a birthday dinner for 8, one person uses a wheelchair, Over-the-Rhine.
  call: {tool: nearest, args: {lat: 39.1140, lon: -84.5150, need: listed_wheelchair_accessible, place_type: food_drink, max_miles: 0.7}}
  expect_any: [Taglio, MECCA, Alice, Ché]
  note: party size and table type are not in the data

